site_name: Conspiratio — Handbuch zum Godot-Client
site_description: Spielerhandbuch zum Godot-Client von Conspiratio
site_url: https://conspiratio.github.io/Conspiratio.Wiki/
repo_url: https://github.com/Conspiratio/Conspiratio.Wiki
copyright: GPL-3.0

theme:
  name: material
  language: de
  font: false          # Schriften liefern wir selbst aus
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Auf das dunkle Thema umschalten
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Auf das helle Thema umschalten

extra_css:
  - stylesheets/conspiratio.css

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Handbuch: index.md
  - 1 Hauptmenü:
      - hauptmenue/index.md
      - Spiel-Aufträge und Bestenliste: hauptmenue/auftraege-und-bestenliste.md
      - Profile und Statistik: hauptmenue/profile-und-statistik.md
  - 2 Schreibstube:
      - schreibstube/index.md
      - Auf ein Amt bewerben: schreibstube/auf-ein-amt-bewerben.md
      - Ämter: schreibstube/aemter.md
      - Privilegien: schreibstube/privilegien.md
      - Privilegienliste: schreibstube/privilegienliste.md
      - Geldleiher und Kreditbuch: schreibstube/geldleiher-und-kreditbuch.md
      - Gesetze: schreibstube/gesetze.md
      - Gerichtsverhandlung: schreibstube/gerichtsverhandlung.md
      - Kontrahenten: schreibstube/kontrahenten.md
      - Titel: schreibstube/titel.md
  - 3 Handel:
      - handel/index.md
      - Grafschaften und Städte: handel/grafschaften-und-staedte.md
      - Stadtinformationen: handel/stadtinformationen.md
      - Städte, Produktion und Wohnsitze: handel/staedte-produktion-und-wohnsitze.md
      - Wohnsitze: handel/wohnsitze.md
      - Produktion von Waren: handel/produktion-von-waren.md
      - Produktionsverhältnisse: handel/produktionsverhaeltnisse.md
      - Verkauf und Export von Waren: handel/verkauf-und-export-von-waren.md
  - 4 Hinterzimmer:
      - hinterzimmer/index.md
  - 5 Kirche:
      - kirche/index.md
  - 6 Söldner und Räuber:
      - soeldner-raeuber/index.md
      - Räuberlager: soeldner-raeuber/raeuberlager.md
      - Zollburgen: soeldner-raeuber/zollburgen.md
  - 7 Der Client:
      - client/index.md
      - Steuerung: client/steuerung.md
      - Optionen und Ton: client/optionen-und-ton.md
      - Speichern und Laden: client/speichern-und-laden.md
      - Fehler melden: client/fehler-melden.md
