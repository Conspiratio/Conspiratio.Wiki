site_name: Conspiratio — Handbuch zum Godot-Client
site_description: Spielerhandbuch zum Godot-Client von Conspiratio
site_url: https://conspiratio.github.io/Conspiratio.Wiki/
repo_url: https://github.com/Conspiratio/Conspiratio.Wiki
copyright: GPL-3.0

theme:
  name: material
  language: de
  font: false          # Schriften liefern wir selbst aus
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Auf das dunkle Thema umschalten
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Auf das helle Thema umschalten

extra_css:
  - stylesheets/conspiratio.css

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Handbuch: index.md
